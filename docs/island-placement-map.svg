<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title description">
<title id="title">Tarosh’s island — a place to explore</title>
<desc id="description">Schematic placement plan based on inspected model coordinates. Introduction on the veranda, engineering notebook on the rear deck, projects on the changing cabin, career cards over the hammock, contact beside the pier. The beach and lagoon remain areas to explore.</desc>
