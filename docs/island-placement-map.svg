<text x="606" y="608" class="small" fill="#d4e3cf">THE LAGOON</text><text x="571" y="632" font-size="13" fill="#c8dcc8">Fish, seaweed &amp; small discoveries</text>
<path d="M60 788H796" stroke="#b7d0bf" opacity=".3"/>
<text x="60" y="819" font-size="13" fill="#d6e1ce">Schematic plan • landmarks anchored to model coordinates</text>
<text x="60" y="841" font-size="12" fill="#b4cdba">Roof, vegetation and shorelines simplified. New content placements are proposed.</text>
<!-- Editorial legend. -->
<text x="872" y="73" class="small" fill="#71816a">PLACEMENT DECISIONS</text>
<text x="872" y="118" font-family="Georgia,serif" font-size="31" fill="#163f35">Let the island lead.</text>
<text x="872" y="151" class="body">Five content homes. A whole island</text><text x="872" y="174" class="body">left open for curiosity.</text>
<path d="M872 199H1236" stroke="#c7c9b1"/>
<text x="873" y="237" class="small" fill="#7a895f">01 / ABOUT</text><text x="872" y="267" class="legend">A magazine on the table</text><text x="872" y="293" class="body">Read an introduction among the sofas,</text><text x="872" y="316" class="body">coffee tables and everyday objects.</text>
<text x="873" y="357" class="small" fill="#7a895f">02 / SELECTED WORK</text><text x="872" y="387" class="legend">Projects pinned to the cabin</text><text x="872" y="413" class="body">Two visual project posters; the beach</text><text x="872" y="436" class="body">chalkboard becomes their small index.</text>
<text x="873" y="477" class="small" fill="#7a895f">03 / ENGINEERING</text><text x="872" y="507" class="legend">A notebook on the rear deck</text><text x="872" y="533" class="body">Build, scale, operate, explore — beside</text><text x="872" y="556" class="body">the loungers, with space to look around.</text>
<text x="873" y="597" class="small" fill="#7a895f">04 / THE JOURNEY</text><text x="872" y="627" class="legend">Career cards between palms</text><text x="872" y="653" class="body">Three chapters pegged above the</text><text x="872" y="676" class="body">hammock, tied to its actual trees.</text>
<text x="873" y="717" class="small" fill="#7a895f">05 / CONTACT</text><text x="872" y="747" class="legend">A little postbox on the pier</text><text x="872" y="773" class="body">An invitation to connect, with the</text><text x="872" y="796" class="body">walkway and water still in view.</text>
<path d="M872 824H1236" stroke="#c7c9b1"/><text x="872" y="852" font-size="13" fill="#466459">Wide views first. Close reading by choice.</text>
</svg>
